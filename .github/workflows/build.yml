name: Build and package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cc65
      - name: Build application and storage diagnostic
        run: make X16PERF.PRG STORAGE.PRG
      - name: Create Windows ZIP
        run: python3 scripts/package.py dist/X16Perfect-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: X16Perfect
          path: |
            X16PERF.PRG
            dist/X16Perfect-Windows.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: X16Perfect
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          prg=release-assets/X16PERF.PRG
          windows=release-assets/dist/X16Perfect-Windows.zip
          test -s "$prg"
          unzip -tq "$windows"

          if release=$(gh release view "$RELEASE_TAG" --json isDraft,assets); then
            if jq -e '.isDraft == false' <<< "$release" > /dev/null; then
              jq -e '[.assets[].name] | contains(["X16PERF.PRG", "X16Perfect-Windows.zip"])' \
                <<< "$release" > /dev/null
              exit 0
            fi
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" \
              --title "X16Perfect $RELEASE_TAG" \
              --notes 'Download X16PERF.PRG for the Commander X16. On Windows, extract X16Perfect-Windows.zip. Install X16Emu R49 separately following the included README, then run RUN-WINDOWS.bat.'
          fi
          gh release upload "$RELEASE_TAG" "$prg" "$windows" --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  replace-preview-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: X16Perfect
          path: release-assets
      - name: Replace the first preview's Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.1.0-preview.1
          windows=release-assets/dist/X16Perfect-Windows.zip
          unzip -tq "$windows"
          gh release upload "$tag" "$windows" --clobber
          gh release edit "$tag" --notes 'Download X16PERF.PRG for the Commander X16. On Windows, extract X16Perfect-Windows.zip. Install X16Emu R49 separately following the included README, then run RUN-WINDOWS.bat.'
