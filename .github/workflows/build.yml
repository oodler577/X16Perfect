name: Build and package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave blank to build only)
        type: string

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || (github.event_name == 'push' && github.ref_name == 'master' && github.event.head_commit.message == 'Fix annotated Beta release publication' && 'v0.1.0-beta.1') || '' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}
          persist-credentials: false
      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cc65
      - name: Build application and storage diagnostics
        run: make X16PERF.PRG STORAGE.PRG SAVETEST.PRG RETRIEVE.PRG
      - name: Create Windows ZIP
        run: python3 scripts/package.py dist/X16Perfect-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: X16Perfect
          path: |
            X16PERF.PRG
            dist/X16Perfect-Windows.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
      (github.event_name == 'push' && github.ref_name == 'master' &&
       github.event.head_commit.message == 'Fix annotated Beta release publication')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.0-beta.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: X16Perfect
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prg=release-assets/X16PERF.PRG
          windows=release-assets/dist/X16Perfect-Windows.zip
          test -s "$prg"
          unzip -tq "$windows"

          if release=$(gh release view "$RELEASE_TAG" --json isDraft,assets); then
            if jq -e '.isDraft == false' <<< "$release" > /dev/null; then
              jq -e '[.assets[].name] | contains(["X16PERF.PRG", "X16Perfect-Windows.zip"])' \
                <<< "$release" > /dev/null
              exit 0
            fi
          else
            title="X16Perfect $RELEASE_TAG"
            flags=(--notes 'Download X16PERF.PRG for the Commander X16. On Windows, extract X16Perfect-Windows.zip into its own folder directly under your separate X16Emu R49 installation, then double-click RUN-WINDOWS.bat.')
            if [[ "$RELEASE_TAG" == *-beta.* ]]; then
              title="X16Perfect ${RELEASE_TAG%%-beta.*} Beta ${RELEASE_TAG##*-beta.}"
              flags=(--latest=false --notes-from-tag)
            elif [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" --title "$title"
          fi
          gh release upload "$RELEASE_TAG" "$prg" "$windows" --clobber
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
